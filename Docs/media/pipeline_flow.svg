<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrowLoop" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="800" fill="#ffffff"/>
  <text x="40" y="34" font-size="22" font-weight="700" fill="#0f172a">GAS 전투 파이프라인 — 입력에서 데미지·UI까지</text>

  <!-- MAIN VERTICAL FLOW -->
  <!-- 1 Input -->
  <rect x="40" y="56" width="480" height="58" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="60" y="80" font-size="15" font-weight="700" fill="#1e3a8a">① 입력 (Enhanced Input)</text>
  <text x="60" y="100" font-size="13" fill="#334155">InputAction → InputTag (Ability.Type.*), Tap/Hold 트리거는 데이터로 지정</text>

  <line x1="280" y1="114" x2="280" y2="134" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 Routing -->
  <rect x="40" y="136" width="480" height="58" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="60" y="160" font-size="15" font-weight="700" fill="#1e3a8a">② 태그 라우팅</text>
  <text x="60" y="180" font-size="13" fill="#334155">InputTagUseAbility → ASC.TryActivateAbilitiesByTag(InputTag)</text>

  <line x1="280" y1="194" x2="280" y2="214" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3 Ability start -->
  <rect x="40" y="216" width="480" height="58" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="60" y="240" font-size="15" font-weight="700" fill="#065f46">③ 어빌리티 시작 (GameplayAbility)</text>
  <text x="60" y="260" font-size="13" fill="#334155">GA_BaseAttack::ActivateAbility · PlayMontageAndWait(몽타주)</text>

  <line x1="280" y1="274" x2="280" y2="294" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4 Anim + HitCheck -->
  <rect x="40" y="296" width="480" height="58" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="60" y="320" font-size="15" font-weight="700" fill="#92400e">④ 애니 + 판정 (AnimNotifyState)</text>
  <text x="60" y="340" font-size="13" fill="#334155">WeaponAnimNotifyState: 무기 소켓 Root→Tip 스피어 스윕</text>

  <line x1="280" y1="354" x2="280" y2="374" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5 Hit event -->
  <rect x="40" y="376" width="480" height="58" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="60" y="400" font-size="15" font-weight="700" fill="#92400e">⑤ 히트 이벤트 (스윙당 1회)</text>
  <text x="60" y="420" font-size="13" fill="#334155">SendGameplayEvent(HitEventTag, TargetData=SingleTargetHit)</text>

  <line x1="280" y1="434" x2="280" y2="454" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6 Receive -->
  <rect x="40" y="456" width="480" height="58" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="60" y="480" font-size="15" font-weight="700" fill="#065f46">⑥ 이벤트 수신 (같은 어빌리티)</text>
  <text x="60" y="500" font-size="13" fill="#334155">WaitGameplayEvent(Event.*.Hit) → OnHitEvent</text>

  <line x1="280" y1="514" x2="280" y2="534" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 7 Apply GE -->
  <rect x="40" y="536" width="480" height="58" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="60" y="560" font-size="15" font-weight="700" fill="#991b1b">⑦ 데미지 적용 (GameplayEffect)</text>
  <text x="60" y="580" font-size="13" fill="#334155">MakeOutgoingSpec + ApplyGE — SetByCaller(Data.Damage)</text>

  <line x1="280" y1="594" x2="280" y2="614" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 8 Choke point -->
  <rect x="40" y="616" width="480" height="66" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2.5"/>
  <text x="60" y="640" font-size="15" font-weight="700" fill="#991b1b">⑧ 단일 초크 포인트 (AttributeSet)</text>
  <text x="60" y="660" font-size="13" fill="#334155">PostGameplayEffectExecute:</text>
  <text x="60" y="676" font-size="13" fill="#334155">Damage(meta)→HP · 그로기 시 ×1.5 · HP 0 → HandleDeath</text>

  <line x1="280" y1="682" x2="280" y2="702" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 9 UI -->
  <rect x="40" y="704" width="480" height="58" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="60" y="728" font-size="15" font-weight="700" fill="#5b21b6">⑨ UI 갱신</text>
  <text x="60" y="748" font-size="13" fill="#334155">속성 변경 델리게이트 → HP 바 / 그로기 바 / 변주 도넛</text>

  <!-- COMBO SIDE LOOP (from box 4) -->
  <path d="M520,325 L600,325" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowLoop)"/>
  <rect x="608" y="256" width="360" height="150" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="628" y="282" font-size="15" font-weight="700" fill="#3730a3">콤보 루프 (선입력 버퍼링)</text>
  <text x="628" y="306" font-size="13" fill="#334155">· AN_SendGameplayEvent → Event.Combo.WindowOpen</text>
  <text x="628" y="326" font-size="13" fill="#334155">· 창 열림 中 입력 → 즉시 진행 / 아니면 버퍼링</text>
  <text x="628" y="346" font-size="13" fill="#334155">· 재입력 시 InputPressed → bComboInputBuffered</text>
  <text x="628" y="366" font-size="13" fill="#334155">· Montage_JumpToSection(Attack_N+1)</text>
  <text x="628" y="390" font-size="12" font-style="italic" fill="#6366f1">→ ④ 애니/판정으로 되돌아가 다음 타 재생</text>

  <!-- loop back arrow -->
  <path d="M700,406 C700,440 560,430 522,340" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowLoop)"/>

  <!-- VOICE note -->
  <rect x="608" y="440" width="360" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="628" y="464" font-size="14" font-weight="700" fill="#475569">보이스 / 이벤트 채널 분리</text>
  <text x="628" y="484" font-size="12" fill="#475569">Event.Skill.Voice → 랜덤 재생 · HitEventTag로 P/E 채널 분리</text>

  <!-- Legend -->
  <text x="608" y="560" font-size="13" font-weight="700" fill="#0f172a">색상 = 계층</text>
  <rect x="608" y="572" width="16" height="16" rx="3" fill="#dbeafe" stroke="#3b82f6"/><text x="632" y="585" font-size="12" fill="#334155">입력</text>
  <rect x="688" y="572" width="16" height="16" rx="3" fill="#d1fae5" stroke="#10b981"/><text x="712" y="585" font-size="12" fill="#334155">어빌리티</text>
  <rect x="788" y="572" width="16" height="16" rx="3" fill="#fef3c7" stroke="#f59e0b"/><text x="812" y="585" font-size="12" fill="#334155">판정/노티</text>
  <rect x="608" y="598" width="16" height="16" rx="3" fill="#fee2e2" stroke="#ef4444"/><text x="632" y="611" font-size="12" fill="#334155">GE/속성</text>
  <rect x="688" y="598" width="16" height="16" rx="3" fill="#ede9fe" stroke="#8b5cf6"/><text x="712" y="611" font-size="12" fill="#334155">UI</text>
  <rect x="788" y="598" width="16" height="16" rx="3" fill="#e0e7ff" stroke="#6366f1"/><text x="812" y="611" font-size="12" fill="#334155">콤보</text>
</svg>
